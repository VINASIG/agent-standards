<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typed web fixture</title>
    <link rel="stylesheet" href="../static/style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <h1>Typed web fixture</h1>
      <form novalidate autocomplete="off">
        <label for="email">Email address</label
        ><input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        /><button type="submit" disabled>Validate locally</button>
        <p role="status"></p>
      </form>
    </main>
  </body>
</html>
